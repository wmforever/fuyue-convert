name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Java tests
        run: mvn -B -ntp -Dskip.frontend=true test

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Script syntax
        run: |
          bash -n scripts/package-runtime.sh
          bash -n scripts/smoke-runtime-package.sh

  office-integration:
    name: LibreOffice PDF integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install LibreOffice and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress fonts-noto-cjk
          fc-cache -f

      - name: Run real Office to PDF conversions
        run: mvn -B -ntp -pl task-service -am -Dskip.frontend=true -Dtest=LibreOfficePdfConverterTest -Dsurefire.failIfNoSpecifiedTests=false test

  ocr-integration:
    name: Tesseract OCR integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Run real image OCR
        run: mvn -B -ntp -pl task-service -am -Dskip.frontend=true -Dtest=TesseractOcrConverterTest -Dsurefire.failIfNoSpecifiedTests=false test
