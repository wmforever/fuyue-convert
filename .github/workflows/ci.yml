name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject local-only samples and runtime artifacts
        run: node scripts/check-local-only-files.mjs

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Java tests
        run: mvn -B -ntp -Dskip.frontend=true test

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Generate and validate release SBOMs
        run: |
          mkdir -p target/release-metadata
          mvn -B -ntp -DskipTests -Dskip.frontend=true org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=fuyue-convert-java-sbom -DoutputDirectory="$GITHUB_WORKSPACE/target/release-metadata" -Dcyclonedx.skipAttach=true
          cd frontend
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > ../target/release-metadata/fuyue-convert-frontend-sbom.json
          cd ..
          python3 -m json.tool target/release-metadata/fuyue-convert-java-sbom.json >/dev/null
          python3 -m json.tool target/release-metadata/fuyue-convert-frontend-sbom.json >/dev/null

      - name: Script syntax
        run: |
          bash -n scripts/package-runtime.sh
          bash -n scripts/prepare-ocr-runtime.sh
          bash -n scripts/smoke-runtime-package.sh

  office-integration:
    name: LibreOffice PDF integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject local-only samples and runtime artifacts
        run: node scripts/check-local-only-files.mjs

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install LibreOffice and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress fonts-noto-cjk
          fc-cache -f

      - name: Run real Office to PDF conversions
        run: mvn -B -ntp -pl task-service -am -Dskip.frontend=true -Dtest=LibreOfficePdfConverterTest -Dsurefire.failIfNoSpecifiedTests=false test

  ocr-integration:
    name: Tesseract OCR integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject local-only samples and runtime artifacts
        run: node scripts/check-local-only-files.mjs

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-sim-vert fonts-noto-cjk
          fc-cache -f
          tesseract --list-langs | awk '$0 == "eng" { eng=1 } $0 == "chi_sim" { zh=1 } $0 == "chi_sim_vert" { vert=1 } END { exit !(eng && zh && vert) }'

      - name: Run real multilingual and mixed-document OCR
        env:
          FORMAT_CONVERTER_OCR_ENABLED: "true"
          FORMAT_CONVERTER_OCR_LANGUAGES: chi_sim+eng
          FORMAT_CONVERTER_OCR_MAX_CONCURRENCY: "1"
        run: mvn -B -ntp -pl task-service -am -Dskip.frontend=true -Dtest=TesseractOcrConverterTest,TesseractMultilingualIntegrationTest,OcrEnabledRegistryIntegrationTest,PdfOcrConverterTest,OfdOcrConverterTest -Dsurefire.failIfNoSpecifiedTests=false test
