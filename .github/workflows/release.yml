name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node for Electron package
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install bundled OCR dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-sim-vert
          echo "FORMAT_CONVERTER_BUNDLE_OCR=true" >> "$GITHUB_ENV"

      - name: Install bundled OCR dependencies
        if: runner.os == 'macOS'
        run: |
          brew install tesseract tesseract-lang
          echo "FORMAT_CONVERTER_BUNDLE_OCR=true" >> "$GITHUB_ENV"

      - name: Install bundled OCR dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $Tesseract = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Recurse -File -Filter tesseract.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Tesseract) { throw "Tesseract was not installed" }
          $Data = Join-Path $env:GITHUB_WORKSPACE "target\bundled-tessdata"
          New-Item -ItemType Directory -Force $Data | Out-Null
          $InstalledData = Join-Path $Tesseract.Directory.FullName "tessdata"
          if (Test-Path $InstalledData) { Copy-Item "$InstalledData\*" $Data -Recurse -Force }
          $Commit = "87416418657359cb625c412a48b6e1d6d41c29bd"
          $Models = @{
            "eng" = "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2"
            "chi_sim" = "a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730"
            "chi_sim_vert" = "20590de84725bab69cde93bd6e8ed360a13cc5421a7e7364ddeb93e9af53d6da"
          }
          foreach ($Entry in $Models.GetEnumerator()) {
            $File = Join-Path $Data "$($Entry.Key).traineddata"
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$Commit/$($Entry.Key).traineddata" -OutFile $File
            if ((Get-FileHash $File -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Entry.Value) { throw "Checksum mismatch: $($Entry.Key)" }
          }
          "FORMAT_CONVERTER_TESSERACT_BINARY=$($Tesseract.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FORMAT_CONVERTER_TESSDATA_SOURCE=$Data" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FORMAT_CONVERTER_BUNDLE_OCR=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package runtime bundle
        if: runner.os != 'Windows'
        run: bash scripts/package-runtime.sh

      - name: Smoke runtime package
        if: runner.os != 'Windows'
        run: bash scripts/smoke-runtime-package.sh dist/*.tar.gz

      - name: Install WiX Toolset 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress --force
          $Candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Recurse -File -Filter candle.exe | Select-Object -First 1
          if (-not $Candle) { $Candle = Get-ChildItem "$env:ChocolateyInstall\lib\wixtoolset\tools" -Recurse -File -Filter candle.exe | Select-Object -First 1 }
          if (-not $Candle) { throw "WiX candle.exe not found" }
          $Candle.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package runtime bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-runtime.ps1

      - name: Smoke runtime package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | ForEach-Object {
            .\scripts\smoke-runtime-package.ps1 -Archive $_.FullName
          }

      - name: Install Electron desktop dependencies
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Check Electron desktop sources
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          npm run check
          npm test

      - name: Package Electron desktop with bundled OCR
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        env:
          FORMAT_CONVERTER_BUNDLE_OCR: "true"
        run: npm run dist:win

      - name: Verify Electron desktop artifact and licenses
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: npm run verify:package -- --require-ocr --require-installer

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: fuyue-convert-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.msi

      - name: Upload Electron desktop package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: fuyue-convert-Windows-desktop
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist-assets
          merge-multiple: true

      - name: Generate release metadata and checksums
        run: |
          mvn -B -ntp -DskipTests -Dskip.frontend=true org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=fuyue-convert-java-sbom -DoutputDirectory="$GITHUB_WORKSPACE/dist-assets" -Dcyclonedx.skipAttach=true
          cd frontend
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > ../dist-assets/fuyue-convert-frontend-sbom.json
          cd ..
          cd desktop
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > ../dist-assets/fuyue-convert-desktop-sbom.json
          cd ..
          cp docs/known-limitations.md dist-assets/KNOWN-LIMITATIONS.md
          cp docs/test-report.md dist-assets/TEST-REPORT.md
          cp THIRD_PARTY_NOTICES.md dist-assets/THIRD-PARTY-NOTICES.md
          python3 -m json.tool dist-assets/fuyue-convert-java-sbom.json >/dev/null
          python3 -m json.tool dist-assets/fuyue-convert-frontend-sbom.json >/dev/null
          python3 -m json.tool dist-assets/fuyue-convert-desktop-sbom.json >/dev/null
          cd dist-assets
          for file in *; do if [ -f "$file" ] && [ "$file" != SHA256SUMS ]; then sha256sum "$file"; fi; done > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
