name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # setup-java uses Adoptium's SemVer form; this resolves exactly to
  # OpenJDK 17.0.20.1+1 (the API reports semver 17.0.20+101).
  TEMURIN_VERSION: "17.0.20+101"
  TEMURIN_RUNTIME_VERSION: "17.0.20.1"

jobs:
  package:
    name: Package Windows x64 desktop
    # This repository variable is a deliberate maintainer-controlled release
    # switch. Keep it false except while publishing an audited tag.
    if: >-
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED == 'true' &&
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED_SHA == github.sha
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify tag and application version
        shell: pwsh
        run: |
          $Desktop = Get-Content desktop\package.json -Raw | ConvertFrom-Json
          if ("v$($Desktop.version)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version $($Desktop.version)"
          }

      - name: Set up pinned Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.TEMURIN_VERSION }}
          architecture: x64
          java-package: jdk
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reject local-only samples and runtime artifacts
        shell: pwsh
        run: node scripts/check-local-only-files.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Check desktop sources
        working-directory: desktop
        shell: pwsh
        run: |
          npm run check
          npm test

      - name: Package public Lite installer
        working-directory: desktop
        shell: pwsh
        env:
          FORMAT_CONVERTER_BUNDLE_OCR: "false"
          FORMAT_CONVERTER_PUBLIC_LITE_RELEASE: "true"
          FORMAT_CONVERTER_REQUIRE_TEMURIN_RUNTIME: "true"
          FORMAT_CONVERTER_REQUIRED_RUNTIME_VERSION: ${{ env.TEMURIN_RUNTIME_VERSION }}
        run: npm run dist:win

      - name: Inspect final installer archive
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Installer = Get-ChildItem release\Fuyue-Convert-*-win-x64.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer not found" }
          $SevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $Listing = Join-Path $Installer.DirectoryName "$($Installer.BaseName)-7z-listing.txt"
          & $SevenZip l -slt $Installer.FullName 2>&1 | Tee-Object -FilePath $Listing
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not list the final installer" }
          $Forbidden = @(
            "elevate.exe", "nsis7z.dll", "nsprocess.dll", "nsprocessw.dll",
            "stdutils.dll", "uac.dll", "winshell.dll"
          )
          $ListedViolations = Get-Content $Listing | ForEach-Object {
            if ($_ -match '^Path = (.+)$') { [IO.Path]::GetFileName($Matches[1]).ToLowerInvariant() }
          } | Where-Object { $_ -in $Forbidden }
          if ($ListedViolations) {
            throw "Final installer embeds forbidden NSIS components: $($ListedViolations -join ', ')"
          }
          $Extracted = Join-Path $env:RUNNER_TEMP "fuyue-installer-7z"
          Remove-Item $Extracted -Recurse -Force -ErrorAction SilentlyContinue
          try {
            & $SevenZip x -y "-o$Extracted" $Installer.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7-Zip could not extract the final installer" }
            $ExtractedViolations = Get-ChildItem $Extracted -File -Recurse | Where-Object {
              $_.Name.ToLowerInvariant() -in $Forbidden
            }
            if ($ExtractedViolations) {
              throw "Extracted installer contains forbidden NSIS components: $($ExtractedViolations.FullName -join ', ')"
            }
          } finally {
            Remove-Item $Extracted -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify unpacked application and installer
        working-directory: desktop
        shell: pwsh
        run: npm run verify:package -- --public-lite --require-installer

      - name: Verify installed application payload
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Installer = Get-ChildItem release\Fuyue-Convert-*-win-x64.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer not found" }
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\Fuyue Convert"
          $OverrideDir = Join-Path $env:RUNNER_TEMP "fuyue-untrusted-install-override"
          $AppProcess = $null
          Remove-Item $InstallDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $OverrideDir -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $Install = Start-Process -FilePath $Installer.FullName -ArgumentList @("/S", "/D=$OverrideDir") -Wait -PassThru
            if ($Install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($Install.ExitCode)" }
            if (Test-Path (Join-Path $OverrideDir "Fuyue Convert.exe")) {
              throw "Installer accepted an untrusted /D target"
            }
            node scripts/verify-packaged.mjs (Join-Path $InstallDir "resources") --public-lite
            if ($LASTEXITCODE -ne 0) { throw "Installed payload verification failed" }
            $Executable = Join-Path $InstallDir "Fuyue Convert.exe"
            if (-not (Test-Path $Executable)) { throw "Installed desktop executable not found" }
            $AppProcess = Start-Process -FilePath $Executable -ArgumentList "--remote-debugging-port=9227" -PassThru
            node scripts/smoke-conversion.mjs 9227 test\fixtures\smoke.txt --close-app
            if ($LASTEXITCODE -ne 0) { throw "Installed desktop conversion smoke test failed" }
            if (-not $AppProcess.WaitForExit(45000)) { throw "Desktop application did not exit gracefully" }
            Start-Sleep -Seconds 2
            $Residual = Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($InstallDir, [System.StringComparison]::OrdinalIgnoreCase)
            }
            if ($Residual) { throw "Installed application left residual processes: $($Residual.ProcessId -join ', ')" }
          } finally {
            if ($AppProcess -and -not $AppProcess.HasExited) {
              Stop-Process -Id $AppProcess.Id -Force -ErrorAction SilentlyContinue
            }
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($InstallDir, [System.StringComparison]::OrdinalIgnoreCase)
            } | ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
            for ($Attempt = 0; $Attempt -lt 60; $Attempt++) {
              $RemainingProcesses = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($InstallDir, [System.StringComparison]::OrdinalIgnoreCase)
              }
              if (-not $RemainingProcesses) { break }
              $RemainingProcesses | ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Milliseconds 250
            }
            $RemainingProcesses = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($InstallDir, [System.StringComparison]::OrdinalIgnoreCase)
            }
            if ($RemainingProcesses) {
              throw "Could not stop installed application processes before uninstall: $($RemainingProcesses.ProcessId -join ', ')"
            }
            $Uninstaller = Get-ChildItem $InstallDir -Filter "Uninstall*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $Uninstaller) { throw "Installed application did not contain its uninstaller" }
            $Uninstall = Start-Process -FilePath $Uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
            if ($Uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed with exit code $($Uninstall.ExitCode)" }
            for ($Attempt = 0; $Attempt -lt 120 -and (Test-Path $InstallDir); $Attempt++) {
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $InstallDir) {
              Get-ChildItem $InstallDir -Force -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
              throw "Uninstaller left the installation directory behind"
            }
            Remove-Item $OverrideDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Export audited runtime metadata
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $BaseName = "Fuyue-Convert-$Version-win-x64"
          $Publish = "release\publish"
          Remove-Item $Publish -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Publish -ItemType Directory -Force | Out-Null
          Copy-Item "release\$BaseName.exe" $Publish
          Copy-Item "release\$BaseName-7z-listing.txt" $Publish
          Copy-Item release\win-unpacked\resources\backend\RUNTIME-COMPONENTS.json $Publish
          Copy-Item release\win-unpacked\resources\backend\licenses\THIRD-PARTY-LICENSES.txt $Publish

      - name: Upload Windows desktop installer and audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuyue-convert-Windows-x64-desktop
          path: desktop/release/publish/
          if-no-files-found: error

  package_macos:
    name: Package macOS ${{ matrix.display_arch }} desktop
    # Build and test on the matching native CPU. Fixed labels avoid both
    # cross-building and the moving macos-latest alias.
    if: >-
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED == 'true' &&
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED_SHA == github.sha
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            java_arch: x64
            machine_arch: x86_64
            app_directory: mac
            artifact_suffix: macOS-Intel
            display_arch: Intel x64
          - runner: macos-15
            arch: arm64
            java_arch: aarch64
            machine_arch: arm64
            app_directory: mac-arm64
            artifact_suffix: macOS-Apple-Silicon
            display_arch: Apple Silicon
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify native runner, tag, and application version
        shell: bash
        env:
          EXPECTED_MACHINE_ARCH: ${{ matrix.machine_arch }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "$EXPECTED_MACHINE_ARCH" ]; then
            echo "Expected native $EXPECTED_MACHINE_ARCH runner, got $(uname -m)" >&2
            exit 1
          fi
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          if [ "v$desktop_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $desktop_version" >&2
            exit 1
          fi

      - name: Set up pinned Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.TEMURIN_VERSION }}
          architecture: ${{ matrix.java_arch }}
          java-package: jdk
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reject local-only samples and runtime artifacts
        run: node scripts/check-local-only-files.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Check desktop sources
        working-directory: desktop
        run: |
          npm run check
          npm test

      - name: Package public Lite disk image
        working-directory: desktop
        env:
          FORMAT_CONVERTER_BUNDLE_OCR: "false"
          FORMAT_CONVERTER_PUBLIC_LITE_RELEASE: "true"
          FORMAT_CONVERTER_REQUIRE_TEMURIN_RUNTIME: "true"
          FORMAT_CONVERTER_REQUIRED_RUNTIME_VERSION: ${{ env.TEMURIN_RUNTIME_VERSION }}
        run: npm run dist:mac

      - name: Install from DMG and run a real conversion
        working-directory: desktop
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          disk_images=(release/Fuyue-Convert-*-"$ARTIFACT_SUFFIX".dmg)
          if [ "${#disk_images[@]}" -ne 1 ]; then
            echo "Expected exactly one $PACKAGE_ARCH DMG, found ${#disk_images[@]}" >&2
            exit 1
          fi
          disk_image="${disk_images[0]}"
          hdiutil verify "$disk_image"

          mount_point="$RUNNER_TEMP/fuyue-dmg-$PACKAGE_ARCH"
          install_root="$RUNNER_TEMP/fuyue-installed-$PACKAGE_ARCH"
          installed_app="$install_root/Fuyue Convert.app"
          application_pid=""
          mounted=false

          application_pids() {
            ps -axo pid=,comm= | awk -v prefix="$installed_app/" '
              {
                pid=$1
                sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0)
                if (index($0, prefix) == 1) print pid
              }'
          }
          cleanup() {
            set +e
            if [ -n "$application_pid" ] && kill -0 "$application_pid" 2>/dev/null; then
              kill "$application_pid" 2>/dev/null
            fi
            residual_pids="$(application_pids)"
            if [ -n "$residual_pids" ]; then
              echo "$residual_pids" | xargs kill 2>/dev/null
            fi
            if [ "$mounted" = true ]; then
              hdiutil detach "$mount_point" -force >/dev/null 2>&1
            fi
            rm -rf "$mount_point" "$install_root"
          }
          trap cleanup EXIT

          rm -rf "$mount_point" "$install_root"
          mkdir -p "$mount_point" "$install_root"
          hdiutil attach "$disk_image" -readonly -nobrowse -mountpoint "$mount_point"
          mounted=true
          mounted_apps=("$mount_point"/*.app)
          if [ "${#mounted_apps[@]}" -ne 1 ]; then
            echo "DMG must contain exactly one application" >&2
            exit 1
          fi
          ditto "${mounted_apps[0]}" "$installed_app"
          hdiutil detach "$mount_point"
          mounted=false

          resources="$installed_app/Contents/Resources"
          executable="$installed_app/Contents/MacOS/Fuyue Convert"
          test -f "$resources/backend/RUNTIME-COMPONENTS.json"
          test -x "$resources/backend/runtime/bin/java"
          codesign --verify --deep --strict --verbose=2 "$installed_app"
          if spctl --assess --type execute "$installed_app"; then
            echo "Unsigned/unnotarized release unexpectedly passed Gatekeeper assessment" >&2
            exit 1
          else
            echo "Gatekeeper rejection is expected until Developer ID signing and notarization are configured"
          fi

          app_architectures="$(lipo -archs "$executable")"
          expected_binary_arch="$PACKAGE_ARCH"
          if [ "$PACKAGE_ARCH" = "x64" ]; then expected_binary_arch="x86_64"; fi
          if [ "$app_architectures" != "$expected_binary_arch" ]; then
            echo "Application has architecture '$app_architectures', expected '$expected_binary_arch'" >&2
            exit 1
          fi

          "$executable" --remote-debugging-port=9227 >"$RUNNER_TEMP/fuyue-$PACKAGE_ARCH.log" 2>&1 &
          application_pid=$!
          if ! node scripts/smoke-conversion.mjs 9227 test/fixtures/smoke.txt --close-app; then
            cat "$RUNNER_TEMP/fuyue-$PACKAGE_ARCH.log" >&2
            exit 1
          fi
          for attempt in {1..180}; do
            if ! kill -0 "$application_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$application_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/fuyue-$PACKAGE_ARCH.log" >&2
            echo "Desktop application did not exit gracefully" >&2
            exit 1
          fi
          if ! wait "$application_pid"; then
            cat "$RUNNER_TEMP/fuyue-$PACKAGE_ARCH.log" >&2
            echo "Desktop application exited unsuccessfully" >&2
            exit 1
          fi
          application_pid=""
          sleep 2
          residual_pids="$(application_pids)"
          if [ -n "$residual_pids" ]; then
            echo "Installed application left residual processes: $residual_pids" >&2
            exit 1
          fi

          rm -rf "$install_root"
          if [ -e "$installed_app" ]; then
            echo "Installed application could not be removed" >&2
            exit 1
          fi

      - name: Export macOS installer and audit evidence
        working-directory: desktop
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          APP_DIRECTORY: ${{ matrix.app_directory }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          base_name="Fuyue-Convert-$version-$ARTIFACT_SUFFIX"
          publish="release/publish-$PACKAGE_ARCH"
          rm -rf "$publish"
          mkdir -p "$publish"
          cp "release/$base_name.dmg" "$publish/"
          cp "release/$APP_DIRECTORY/Fuyue Convert.app/Contents/Resources/backend/RUNTIME-COMPONENTS.json" \
            "$publish/$base_name-RUNTIME-COMPONENTS.json"
          cp "release/$APP_DIRECTORY/Fuyue Convert.app/Contents/Resources/backend/licenses/THIRD-PARTY-LICENSES.txt" \
            "$publish/$base_name-THIRD-PARTY-LICENSES.txt"

      - name: Upload macOS installer and audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuyue-convert-macOS-${{ matrix.arch }}-desktop
          path: desktop/release/publish-${{ matrix.arch }}/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package
      - package_macos
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED == 'true' &&
      vars.FORMAT_CONVERTER_BINARY_RELEASE_APPROVED_SHA == github.sha
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Reject local-only samples and runtime artifacts
        run: node scripts/check-local-only-files.mjs

      - name: Download Windows installer and audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuyue-convert-Windows-x64-desktop
          path: dist-artifacts/windows-x64

      - name: Download macOS Intel installer and audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuyue-convert-macOS-x64-desktop
          path: dist-artifacts/macos-x64

      - name: Download macOS Apple Silicon installer and audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuyue-convert-macOS-arm64-desktop
          path: dist-artifacts/macos-arm64

      - name: Assemble strict three-installer release allowlist
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          expected=(
            "Fuyue-Convert-$version-win-x64.exe"
            "Fuyue-Convert-$version-macOS-Intel.dmg"
            "Fuyue-Convert-$version-macOS-Apple-Silicon.dmg"
          )
          sources=(
            "dist-artifacts/windows-x64/${expected[0]}"
            "dist-artifacts/macos-x64/${expected[1]}"
            "dist-artifacts/macos-arm64/${expected[2]}"
          )
          rm -rf release-assets
          mkdir release-assets
          for index in "${!expected[@]}"; do
            if [ ! -f "${sources[$index]}" ]; then
              echo "Approved installer is missing: ${sources[$index]}" >&2
              exit 1
            fi
            cp "${sources[$index]}" "release-assets/${expected[$index]}"
          done
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [ "${#actual[@]}" -ne 3 ] || ! diff -u \
            <(printf '%s\n' "${sorted_expected[@]}") \
            <(printf '%s\n' "${actual[@]}"); then
            echo "Release asset allowlist must contain exactly the three installers" >&2
            exit 1
          fi
          (
            echo '## macOS 安装提示'
            echo
            echo '> 当前 macOS 安装包采用 ad-hoc 签名且尚未经过 Apple 公证，首次打开会被 Gatekeeper 拦截。请在“系统设置 → 隐私与安全”中确认“仍要打开”。'
            echo
            echo '## 内置 Java 运行时源码'
            echo
            echo '三个 Lite 安装包内置 Eclipse Temurin 17.0.20.1+1 的裁剪运行时。对应 OpenJDK 源码可从 [Adoptium 官方 Release](https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk-sources_17.0.20.1_1.tar.gz) 获取，SHA-256：`21e2a065d244ab048e737f21af5d1fc74daaeb6707de36477ead8db1dca71214`。'
            echo
            echo '## 安装包 SHA-256'
            echo
            echo '```text'
            cd release-assets
            sha256sum "${sorted_expected[@]}"
            echo '```'
          ) > release-checksums.md

      - name: Publish release with exactly three desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find release-assets -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          if [ "${#installers[@]}" -ne 3 ]; then
            echo "Refusing to publish anything except the three approved installers" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${installers[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$(cat release-checksums.md)"

      - name: Verify published asset allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          expected="$RUNNER_TEMP/expected-release-assets.txt"
          actual="$RUNNER_TEMP/actual-release-assets.txt"
          printf '%s\n' \
            "Fuyue-Convert-$version-macOS-Apple-Silicon.dmg" \
            "Fuyue-Convert-$version-macOS-Intel.dmg" \
            "Fuyue-Convert-$version-win-x64.exe" > "$expected"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("release is not final") else .assets[].name end' \
            | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
