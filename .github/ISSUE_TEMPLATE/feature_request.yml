name: Feature request / 功能建议
description: Suggest a new route, option, platform package, or workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / Problem
      description: 你遇到的场景是什么？现在为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望项目怎么支持？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 类型 / Area
      options:
        - New conversion route
        - Conversion quality
        - UI/UX
        - Release package
        - Deployment
        - Documentation
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你是否试过其他工具、格式或流程？
  - type: textarea
    id: samples
    attributes:
      label: 样本 / Samples
      description: 如果是新格式或新路线，请提供可公开分享的最小样本或格式说明链接。
  - type: textarea
    id: engine_license
    attributes:
      label: 实现引擎与许可证 / Engine and license
      description: 新路线请说明候选库/命令、版本、许可证、是否会进入运行包，以及是否需要云端服务。
  - type: dropdown
    id: quality_goal
    attributes:
      label: 预期质量目标 / Expected quality goal
      options:
        - Visual fidelity / 视觉保真
        - Editable structure / 可编辑结构
        - Data consistency / 数据一致
        - Text extraction / 文本提取
        - Not route-specific / 非转换路线
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: 权利确认 / Rights confirmation
      options:
        - label: 如提供样本，我确认有权公开分享且已完成脱敏；否则本项不涉及样本。
          required: true
