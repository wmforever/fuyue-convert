name: Feature request / 功能建议
description: Suggest a new route, option, platform package, or workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / Problem
      description: 你遇到的场景是什么？现在为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望项目怎么支持？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 类型 / Area
      options:
        - New conversion route
        - Conversion quality
        - UI/UX
        - Release package
        - Deployment
        - Documentation
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你是否试过其他工具、格式或流程？
  - type: textarea
    id: samples
    attributes:
      label: 样本 / Samples
      description: 如果是新格式或新路线，请提供可公开分享的最小样本或格式说明链接。
