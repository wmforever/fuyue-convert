name: Conversion quality / 转换质量反馈
description: Report layout, fidelity, editability, or data-loss issues for a conversion route.
title: "[Quality] "
labels: ["conversion-quality"]
body:
  - type: markdown
    attributes:
      value: |
        这个模板用于反馈“转换结果不像原件、不可编辑、丢内容、分页漂移”等问题。
        请只上传你有权公开分享并且已经完整脱敏的样本；否则请改用合成最小复现。
  - type: input
    id: route
    attributes:
      label: 路线 ID / Route ID
      description: 从系统信息或 `/api/tasks/capabilities` 复制稳定 ID。
      placeholder: ofd-to-docx
    validations:
      required: true
  - type: dropdown
    id: quality_goal
    attributes:
      label: 主要目标 / Primary goal
      options:
        - 视觉保真 / Visual fidelity
        - 可编辑结构 / Editable structure
        - 数据一致 / Data consistency
        - 文本提取 / Text extraction
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题现象 / Problem
      placeholder: 例如：第 2 页表格边框错位；PDF 转 DOCX 后只能看到图片层；中文字体替换导致分页变化。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 样本和对比材料 / Samples and evidence
      description: 可上传源文件、输出文件、截图、渲染图或最小复现样本。必须同时具备公开分享权并完成脱敏。
  - type: textarea
    id: task_evidence
    attributes:
      label: 任务证据 / Task evidence
      description: 质量等级、受影响页码、warning/error code、源/输出文件大小；请勿粘贴 token 或本地绝对路径。
      placeholder: |
        qualityLevel: beta
        pages: 2-3
        warningCodes: FONT_SUBSTITUTED
        sourceBytes: ...
        outputBytes: ...
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 操作系统、版本、LibreOffice/Poppler、字体环境。
  - type: checkboxes
    id: privacy
    attributes:
      label: 样本确认 / Sample confirmation
      options:
        - label: 如提供样本，我确认有权公开分享，并且已移除隐私、商业敏感信息和隐藏元数据；未提供样本时不适用。
          required: true
        - label: 如提供样本，我已检查文档属性、批注、隐藏内容、签章和图片中的个人信息；未提供样本时不适用。
          required: true
