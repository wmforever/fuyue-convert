appId: com.fuyue.formatconverter
productName: Fuyue Convert
artifactName: Fuyue-Convert-${version}-${os}-${arch}.${ext}
toolsets:
  nsis: "1.2.1"
asar: true
electronDownload:
  # `force` selects electron-builder's ElectronGetOptions branch so the
  # reviewed checksums below cannot be dropped as legacy download options.
  force: false
  unsafelyDisableChecksums: false
  checksums:
    electron-v44.7.0-win32-x64.zip: eee30dc8fa1f5ea95490e59f44e46ea68dd24c6e93d22facf70fe5c2d4c2665c
    electron-v44.7.0-darwin-x64.zip: 4fe494a7159b10a81e2098dab388719582065e99e604c4510bb117e282213566
    electron-v44.7.0-darwin-arm64.zip: e04e411b58a0a14375dd21b0ab4a378fd38930a702e4e20e322fee4849404c0b
    electron-v44.7.0-linux-x64.zip: 3ae7d5bdad61c664486c6ab61361dd084d064c8c08af8d13a687096e18ce555a
    electron-v44.7.0-linux-arm64.zip: 9cd736d1f5873839553c3fa6c8c5e57635ec4a399cc2d32e79c82a02d9cd2258
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
directories:
  output: release
  buildResources: assets
afterSign: scripts/after-sign.mjs
files:
  - src/**/*
  - package.json
extraResources:
  - from: .runtime/backend
    to: backend
  - from: node_modules/electron/LICENSE
    to: licenses/ELECTRON-LICENSE.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
win:
  target:
    - target: dir
      arch:
        - x64
  icon: assets/icon.png
  legalTrademarks: Fuyue Convert
mac:
  target:
    - dmg
  icon: assets/icon.png
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  identity: "-"
  notarize: false
publish: null
