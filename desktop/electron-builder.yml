appId: com.fuyue.formatconverter
productName: Fuyue Convert
artifactName: Fuyue-Convert-${version}-${os}-${arch}.${ext}
toolsets:
  nsis: "1.2.1"
asar: true
electronDownload:
  # `force` selects electron-builder's ElectronGetOptions branch so the
  # reviewed checksums below cannot be dropped as legacy download options.
  force: false
  unsafelyDisableChecksums: false
  checksums:
    electron-v44.0.0-win32-x64.zip: e61aa3bcea8152bc0730abd015e47c032d778a0ef10e2a1c78ba3c4ea47942f9
    electron-v44.0.0-darwin-x64.zip: 28429e700ad68d9624aaa90b6543ffe891a48c14121fd904cd294e5edcee63ff
    electron-v44.0.0-darwin-arm64.zip: 076d79742986e1b100b69ebecc691cb07368045e54c9087cef631b8622b76a80
    electron-v44.0.0-linux-x64.zip: d65286d812719f2b4c1a1b806a80f288a1058c89c7b058dae1e03ab25e499446
    electron-v44.0.0-linux-arm64.zip: 74b6f18bc29c0d52cf8e963c45d476800419097c6f3d53b27c5df335207e52bb
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
directories:
  output: release
  buildResources: assets
files:
  - src/**/*
  - package.json
extraResources:
  - from: .runtime/backend
    to: backend
  - from: node_modules/electron/LICENSE
    to: licenses/ELECTRON-LICENSE.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
win:
  target:
    - target: dir
      arch:
        - x64
  icon: assets/icon.png
  legalTrademarks: Fuyue Convert
mac:
  target:
    - dir
  icon: assets/icon.png
  category: public.app-category.productivity
publish: null
