server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /
spring:
  application:
    name: format-converter
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:250MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
format-converter:
  data-root: ${FORMAT_CONVERTER_DATA_ROOT:./data}
  concurrency: ${FORMAT_CONVERTER_CONCURRENCY:2}
  queue-capacity: ${FORMAT_CONVERTER_QUEUE_CAPACITY:20}
  timeout: ${FORMAT_CONVERTER_TIMEOUT:5m}
  result-ttl: ${FORMAT_CONVERTER_RESULT_TTL:24h}
  max-file-size: ${FORMAT_CONVERTER_MAX_FILE_BYTES:52428800}
  max-expanded-size: ${FORMAT_CONVERTER_MAX_EXPANDED_BYTES:209715200}
  max-entry-size: ${FORMAT_CONVERTER_MAX_ENTRY_BYTES:41943040}
  max-entries: ${FORMAT_CONVERTER_MAX_ENTRIES:10000}
  max-compression-ratio: ${FORMAT_CONVERTER_MAX_COMPRESSION_RATIO:100}
  max-pages: ${FORMAT_CONVERTER_MAX_PAGES:500}
  office-enabled: ${FORMAT_CONVERTER_OFFICE_ENABLED:true}
  office-binary: ${FORMAT_CONVERTER_OFFICE_BINARY:}
  office-timeout: ${FORMAT_CONVERTER_OFFICE_TIMEOUT:2m}
  api-token: ${FORMAT_CONVERTER_API_TOKEN:}
  auto-open-browser: ${FORMAT_CONVERTER_AUTO_OPEN_BROWSER:false}
  worker-enabled: ${FORMAT_CONVERTER_WORKER_ENABLED:true}
  worker-max-memory-mb: ${FORMAT_CONVERTER_WORKER_MAX_MEMORY_MB:768}
  worker-java-binary: ${FORMAT_CONVERTER_WORKER_JAVA_BINARY:}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.fuyue.formatconverter: INFO
build:
  version: "0.1.1"
